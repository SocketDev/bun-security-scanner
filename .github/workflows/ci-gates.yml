# Repository CI for checks and tests.
name: 'ci: gates'
run-name: 'ci: gates'

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@12.14.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Bun
        run: npm install --global bun@1.4.4
      - name: Check
        run: pnpm run check

  test:
    name: 'Test (${{ matrix.os }})'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@12.14.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Bun
        shell: bash
        run: |
          npm install --global bun@1.4.4
      - name: Run tests
        env:
          # Authenticate build-time GitHub API reads (release listings,
          # prebuilt-artifact downloads). Unauthenticated calls share the
          # hosted runner's IP-scoped rate limit and 403 under load.
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: pnpm run build && pnpm run test
