[install.security]
scanner = "./src/index.ts"

[test]
# Coverage scope mirrors the fleet vitest coverage excludes: measure `src/`
# only. `dist/**` is the built bundle test/dist.test.ts smoke-tests, `test/**`
# holds the suites plus the cascaded fleet helpers.
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["dist/**", "test/**"]
# Thresholds are NOT set here. The fleet coverage runner reads bun's lcov and
# applies `cover.thresholds` + `cover.perFileThresholds` from
# .config/repo/socket-wheelhouse.json itself, because bun's own
# `coverageThreshold` accepts singular keys (`line`, `function`) without
# complaint and then ignores them — `{ line = 0.99 }` exits 0 at 50% coverage.
# A gate a typo can disable is not a gate.
